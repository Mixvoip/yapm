openapi: 3.0.0
info:
  title: YAPM API
  description: API for Yet Another Password Manager
  version: 1.0.0

servers:
  - url: http://localhost:8000
    description: API base URL

tags:
  - name: Authentication
    description: Authentication related operations
  - name: Audit Logs
    description: Audit logs related operations
  - name: Folders
    description: Folder related operations
  - name: Groups
    description: Group related operations
  - name: Passwords
    description: Password related operations
  - name: Share Processes
    description: Share process related operations
  - name: Time-Based Shares
    description: Time-limited password sharing between users
  - name: Users
    description: User management
  - name: Vaults
    description: Vault related operations
  - name: WebAuthn
    description: WebAuthn/Passkey registration, authentication, and credential management

paths:
  /audit-logs:
    get:
      tags:
        - Audit Logs
      summary: Get audit logs
      description: Retrieve audit log entries with pagination
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/search'
        - name: userId
          in: query
          required: false
          description: Filter by user ID
          schema:
            type: string
            format: uuid
        - name: actionType
          in: query
          required: false
          description: Filter by audit action
          schema:
            type: string
            enum: [created, updated, deleted, accessed]
        - name: startDate
          in: query
          required: false
          description: Filter by start date/time
          schema:
            $ref: "#/components/schemas/DateTime"
        - name: endDate
          in: query
          required: false
          description: Filter by end date/time
          schema:
            $ref: "#/components/schemas/DateTime"
      responses:
        200:
          description: Audit log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogListResponse'
        400:
          description: Invalid request format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
        403:
          description: Access Denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedErrorResponse'
  /folders:
    post:
      tags:
        - Folders
      summary: Create a new folder
      description: Create a new folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFolderRequest'
        description: If groups are omitted from the request body, the groups from the parent resource will be used.
      responses:
        201:
          description: Folder created Successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderWithGroups'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
        422:
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableEntityErrorResponse'
  /folders/{id}:
    get:
      tags:
        - Folders
      summary: Retrieve a folder
      description: Retrieve a folder by its id
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        200:
          description: Folder response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderWithGroups'
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
        404:
          description: Folder not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags:
        - Folders
      summary: Patch a folder
      description: Update given folder fields
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Folder name
                  example: My Folder
                externalId:
                  type: string
                  description: External folder id
                  example: 123
                  nullable: true
                iconName:
                  type: string
                  description: Icon name
                  example: folder
                description:
                  type: string
                  description: Folder description
                  example: My folder description
                  nullable: true
      responses:
        200:
          description: Folder updated Successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderWithGroups'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
        403:
          description: Access Denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedErrorResponse'
        404:
          description: Folder not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        422:
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableEntityErrorResponse'
  /folders/{id}/changelogs/{logId}:
    get:
      tags:
        - Folders
      summary: Retrieve a folder changelog
      description: Retrieve a single folder changelog by its id or all changelogs for a folder
      parameters:
        - $ref: "#/components/parameters/id"
        - name: logId
          in: path
          required: false
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        200:
          description: Audit log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangelogSummarizedList'
              examples:
                changelogList:
                  value:
                    - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      type: updated
                      fields: ["name", "updatedBy"]
                      timestamp: 2025-04-30 12:00:00
                changelog:
                  value:
                    id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    actionType: updated
                    userEmail: admin@example.com
                    oldValues: { "email": "old@email.com" }
                    newValues: { "email": "new@email.com" }
                    createdAt: 2025-04-30 12:00:00
        400:
          description: Invalid request format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
        404:
          description: Password not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /folders/{id}/delete:
    post:
      tags:
        - Folders
      summary: Delete a folder
      description: Delete a folder and all its content
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticationData"
        description: >
          The request body must contain the user's authentication data
          (either encryptedPassword or prfData).
      responses:
        204:
          description: Folder deleted Successfully
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
        403:
          description: Access Denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedErrorResponse'
        404:
          description: Folder not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        422:
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableEntityErrorResponse'
  /folders/{id}/passwords:
    get:
      tags:
        - Folders
      summary: Retrieve all passwords for a folder
      description: Retrieve all passwords for a folder by folder id
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        200:
          description: Passwords response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordWithGroupsList'
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
        404:
          description: Folder not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /folders/{id}/permissions:
    patch:
      tags:
        - Folders
      summary: Patch folder permissions
      description: Update folder permissions
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchPermissionsWithPartial"
      responses:
        202:
          description: Folder permissions update request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareProcessMinimised'
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
        403:
          description: Access Denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedErrorResponse'
        404:
          description: Folder not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        422:
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableEntityErrorResponse'
  /folders/{id}/structure:
    get:
      tags:
        - Folders
      summary: Retrieve a folder structure
      description: Retrieve the folder and password structure for a folder by folder id
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        200:
          description: Folder structure response
          content:
            application/json:
              schema:
                type: object
                properties:
                  folder:
                    $ref: '#/components/schemas/FolderStructure'
                  folders:
                    type: array
                    items:
                      - $ref: '#/components/schemas/FolderStructure'
                  passwords:
                    type: array
                    items:
                      - $ref: '#/components/schemas/PasswordMinimised'
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
        404:
          description: Folder not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /folders/search:
    get:
      tags:
        - Folders
      summary: Search for folders
      description: Search for folders
      parameters:
        - $ref: "#/components/parameters/search"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
        - name: vaultId
          in: query
          required: false
          description: Filter by vault id
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Folders response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/FolderMinimised"
                        - type: object
                          properties:
                            externalId:
                              type: string
                              example: 123
                              nullable: true
                            vault:
                              $ref: '#/components/schemas/VaultMinimised'
                            folder:
                              allOf:
                                - $ref: '#/components/schemas/FolderMinimised'
                                - nullable: true
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        400:
          description: Invalid request format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /groups:
    get:
      tags:
        - Groups
      summary: Group list
      description: Returns a list of available groups
      parameters:
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/displayType'
      responses:
        200:
          description: Group list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupListResponse'
              examples:
                display-type=list:
                  value:
                    - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      name: Administrators
                      private: false
                display-type=table:
                  value:
                    - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      name: Administrators
                      private: false
                      userCount: 5
                      managers:
                        - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                          username: admin
                          email: admin@example.com
                      createdAt: 2025-04-30 12:00:00
                      createdBy: admin
                      updatedAt: 2025-05-30 12:00:00
                      updatedBy: admin
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
        404:
          description: Invalid request format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Groups
      summary: Create a new Group
      description: Create a new Group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        201:
          description: Group created Successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupWithUsersAndManagers'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
        403:
          description: Access Denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedErrorResponse'
        409:
          description: A group with the provided name already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    $ref: '#/components/schemas/Id'
  /groups/{id}:
    get:
      tags:
        - Groups
      summary: Retrieve a group
      description: Retrieve a group by its id
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        200:
          description: Group response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupWithUsersAndManagers'
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
        404:
          description: Group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags:
        - Groups
      summary: Patch a group
      description: Update given group fields, admins can promote/demote managers and remove users, group managers can add/remove users
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchGroupRequest"
      responses:
        200:
          description: Group updated Successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupWithUsersAndManagers'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
        404:
          description: Group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /groups/{id}/delete:
    post:
      tags:
        - Groups
      summary: Delete a group
      description: Delete a group by its id
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticationData"
        description: >
          The request body must contain the user's authentication data
          (either encryptedPassword or prfData).
      responses:
        204:
          description: Group deleted Successfully
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
        403:
          description: Access Denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedErrorResponse'
        404:
          description: Group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        422:
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableEntityErrorResponse'
  /login_check:
    post:
      tags:
        - Authentication
      summary: User authentication
      description: Authenticates a user and returns a JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        description: >
          The request body must include `encryptedCredentials`, which is the
          encrypted form of the user's login data:
          `{"username": "<string>", "email": "<string>"}`.
          The encryption output must follow the `ClientEncryptedData` schema,
          containing `encryptedData`, `clientPublicKey`, and `nonce`.
      responses:
        200:
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        400:
          description: Invalid request format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
  /passwords:
    post:
      tags:
        - Passwords
      summary: Create a new password
      description: Create a new password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePasswordRequest'
        description: If groups are omitted from the request body, the groups from the parent resource will be used.
      responses:
        201:
          description: Password created Successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordWithFolderWithGroups'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
        422:
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableEntityErrorResponse'
  /passwords/{id}:
    get:
      tags:
        - Passwords
      summary: Retrieve a password
      description: Retrieve a password by its id
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        200:
          description: Password response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordWithFolderWithGroups'
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
        404:
          description: Folder not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags:
        - Passwords
      summary: Patch a password
      description: Update given password fields
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: "My Password"
                description:
                  type: string
                  example: "My Password Description"
                  nullable: true
                target:
                  type: string
                  example: "https://example.com"
                  nullable: true
                location:
                  type: string
                  example: My Password Location
                  nullable: true
                externalId:
                  type: string
                  example: 123
                  nullable: true
      responses:
        200:
          description: Password updated Successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordWithFolderWithGroups'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
        403:
          description: Access Denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedErrorResponse'
        404:
          description: Password not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        422:
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableEntityErrorResponse'
  /passwords/{id}/changelogs/{logId}:
    get:
      tags:
        - Passwords
      summary: Retrieve a password changelog
      description: Retrieve a single password changelog by its id or all changelogs for a password
      parameters:
        - $ref: "#/components/parameters/id"
        - name: logId
          in: path
          required: false
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        200:
          description: Audit log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangelogSummarizedList'
              examples:
                changelogList:
                  value:
                    - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      type: updated
                      fields: ["name", "updatedBy"]
                      timestamp: 2025-04-30 12:00:00
                changelog:
                  value:
                    id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    actionType: updated
                    userEmail: admin@example.com
                    oldValues: { "email": "old@email.com" }
                    newValues: { "email": "new@email.com" }
                    createdAt: 2025-04-30 12:00:00
        400:
          description: Invalid request format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
        404:
          description: Password not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /passwords/{id}/delete:
    post:
      tags:
        - Passwords
      summary: Delete a password
      description: Delete a password by its id
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticationData"
        description: >
          The request body must contain the user's authentication data
          (either encryptedPassword or prfData).
      responses:
        204:
          description: Password deleted Successfully
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
        403:
          description: Access Denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedErrorResponse'
        404:
          description: Password not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        422:
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableEntityErrorResponse'
  /passwords/{id}/permissions:
    patch:
      tags:
        - Passwords
      summary: Patch password permissions
      description: Update password permissions
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchPermissions"
      responses:
        204:
          description: Password permissions updated successfully
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
        403:
          description: Access Denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedErrorResponse'
        404:
          description: Password not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        422:
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableEntityErrorResponse'
  /passwords/{id}/sensitive:
    post:
      tags:
        - Passwords
      summary: Retrieve sensitive data for a password
      description: Retrieve sensitive data for a password by its id encrypted with the user's public key. Requires authentication via password or PRF.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
