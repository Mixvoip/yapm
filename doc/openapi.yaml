      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchPermissionsWithPartial"
      responses:
        202:
          description: Vault permissions update request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareProcessMinimised'
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
        403:
          description: Access Denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedErrorResponse'
        404:
          description: Vault not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        422:
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableEntityErrorResponse'
  /vaults/{id}/structure:
    get:
      tags:
        - Vaults
      summary: Retrieve a vault folder structure
      description: Retrieve the folder and password structure for a vault by vault id
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        200:
          description: Vault structure response
          content:
            application/json:
              schema:
                type: object
                properties:
                  folders:
                    type: array
                    items:
                      - $ref: '#/components/schemas/FolderStructure'
                  passwords:
                    type: array
                    items:
                      - $ref: '#/components/schemas/PasswordMinimised'
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
        404:
          description: Folder not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /time-based-shares:
    post:
      tags:
        - Time-Based Shares
      summary: Create a time-based share
      description: Create a time-limited share of a password with another user. Requires the sharer's encrypted master password for re-encryption.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTimeBasedShareRequest'
      responses:
        201:
          description: Share created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeBasedShareResponse'
        400:
          description: Validation error (self-share, inactive recipient, incomplete setup)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        401:
          description: Authentication failed (invalid master password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
        404:
          description: Password not found or no access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        409:
          description: An active share for this password already exists for this recipient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /time-based-shares/my-shares:
    get:
      tags:
        - Time-Based Shares
      summary: Get current user's active shares
      description: Returns all non-expired shares where the current user is either the creator or the recipient.
      responses:
        200:
          description: List of active shares
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeBasedShareResponse'
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
  /time-based-shares/{id}:
    get:
      tags:
        - Time-Based Shares
      summary: Get share metadata
      description: Get metadata for a time-based share (no sensitive data). Accessible by both the creator and the recipient.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        200:
          description: Share metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeBasedShareResponse'
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
        404:
          description: Share not found, expired, or user has no access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /time-based-shares/{id}/sensitive-data:
    post:
      tags:
        - Time-Based Shares
      summary: Get encrypted sensitive data
      description: Returns the encrypted password and username data for a share. Only accessible by the recipient. Tracks first access time. Requires authentication via password or PRF.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationData'
        description: >
          The request body must contain the user's authentication data
          (either encryptedPassword or prfData).
      responses:
        200:
          description: Encrypted sensitive data with user keys for decryption
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeBasedShareSensitiveDataResponse'
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
        404:
          description: Share not found, expired, or user is not the recipient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /time-based-shares/{id}/revoke:
    post:
      tags:
        - Time-Based Shares
      summary: Revoke a share
      description: Revokes an active share by setting its expiry to now. Only the creator can revoke a share.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        204:
          description: Share revoked successfully
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
        404:
          description: Share not found, already expired, or user is not the creator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /webauthn/register/options:
    get:
      tags:
        - WebAuthn
      summary: Get registration options
      description: >
        Get WebAuthn registration options for the authenticated user.
        Returns the public key creation options, a PRF salt for key derivation,
        and the user's encrypted keys (so the client can decrypt the private key during registration).
      responses:
        200:
          description: Registration options
          content:
            application/json:
              schema:
                type: object
                properties:
                  publicKeyOptions:
                    type: object
                    description: W3C WebAuthn PublicKeyCredentialCreationOptions
                  prfSalt:
                    type: string
                    description: Base64-encoded PRF salt for key derivation
                  userKeys:
                    $ref: '#/components/schemas/UserKeysResponse'
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
  /webauthn/register/verify:
    post:
      tags:
        - WebAuthn
      summary: Verify registration
      description: >
        Verify the WebAuthn registration response and store the credential.
        Requires master password verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRegistrationRequest'
      responses:
        201:
          description: Credential registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    $ref: '#/components/schemas/Id'
                  name:
                    type: string
        400:
          description: Registration verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        401:
          description: Master password verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
  /webauthn/authenticate/options:
    get:
      tags:
        - WebAuthn
      summary: Get authentication options
      description: >
        Get WebAuthn authentication options for sensitive operations (authenticated user).
        Includes PRF salt per credential so the client can derive the encryption key.
      responses:
        200:
          description: Authentication options
          content:
            application/json:
              schema:
                type: object
                properties:
                  publicKeyOptions:
                    type: object
                    description: W3C WebAuthn PublicKeyCredentialRequestOptions
                  prfSalts:
                    type: object
                    additionalProperties:
                      type: string
                    description: Map of base64url credential ID to base64-encoded PRF salt
                  credentialSettings:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        cacheOnUse:
                          type: boolean
                    description: Per-credential settings
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
        404:
          description: User has no registered passkeys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /webauthn/login/options:
    post:
      tags:
        - WebAuthn
      summary: Get login options
      description: >
        Get WebAuthn login options for unauthenticated passkey login.
        Returns credentials scoped to the user identified by email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: User email address
              required:
                - email
      responses:
        200:
          description: Login options
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionToken:
                    type: string
                    description: Session token for the verification step
                  publicKeyOptions:
                    type: object
                    description: W3C WebAuthn PublicKeyCredentialRequestOptions
                  prfSalts:
                    type: object
                    additionalProperties:
                      type: string
                    description: Map of base64url credential ID to base64-encoded PRF salt
        401:
          description: Invalid credentials (user not found or no passkeys)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
  /webauthn/login/discoverable/options:
    get:
      tags:
        - WebAuthn
      summary: Get discoverable login options
      description: >
        Get login options for discoverable credential (usernameless) passkey login.
        No user context needed — the browser shows all resident credentials for the RP.
      security: []
      responses:
        200:
          description: Discoverable login options
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionToken:
                    type: string
                    description: Session token for the verification step
                  publicKeyOptions:
                    type: object
                    description: W3C WebAuthn PublicKeyCredentialRequestOptions (empty allowCredentials)
  /webauthn/login/verify:
    post:
      tags:
        - WebAuthn
      summary: Verify login assertion
      description: >
        Verify a WebAuthn login assertion and return JWT tokens.
        Works for both discoverable and non-discoverable credential flows.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionToken:
                  type: string
                  description: Session token from the login options response
                credential:
                  type: object
                  description: The serialized PublicKeyCredential from the browser
              required:
                - sessionToken
                - credential
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
  /webauthn/credentials:
    get:
      tags:
        - WebAuthn
      summary: List credentials
      description: List all WebAuthn credentials for the authenticated user
      responses:
        200:
          description: List of credentials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebAuthnCredential'
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
  /webauthn/credentials/{id}:
    patch:
      tags:
        - WebAuthn
      summary: Update a credential
      description: Update a WebAuthn credential's settings (e.g. cacheOnUse)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchCredentialRequest'
      responses:
        200:
          description: Credential updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnCredential'
        404:
          description: Credential not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /webauthn/credentials/{id}/delete:
    post:
      tags:
        - WebAuthn
      summary: Delete a credential
      description: Delete a WebAuthn credential. Requires master password verification.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientEncryptedData'
        description: >
          Master password encrypted with the server's public key for verification.
      responses:
        204:
          description: Credential deleted successfully
        401:
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
        404:
          description: Credential not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    search:
      name: search
      in: query
      description: Text used by the search to filter the results on
      schema:
        type: string
    token:
      name: token
      in: path
      required: true
      description: Token to identify the request
      schema:
        type: string
    displayType:
      name: displayType
      in: query
      schema:
        type: string
        enum:
          - list
          - table
        default: list
        description: Determines the level of detail included in the response
    limit:
      name: limit
      in: query
      description: Number of items per page
      required: false
      schema:
        type: integer
        default: 50
    page:
      name: page
      in: query
      description: Page number for pagination
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained after authentication

  schemas:
    LoginRequest:
      type: object
      required:
        - encryptedCredentials
      properties:
        encryptedCredentials:
          $ref: '#/components/schemas/ClientEncryptedData'
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT authentication token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          description: JWT refresh token for obtaining new access tokens
          example: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    AccessDeniedErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error Type
          example: Access Denied
    AuthenticationErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Error message
          example: Invalid credentials.
        code:
          type: integer
          description: Error code
          example: 401
    UnprocessableEntityErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Unprocessable entity error type
          example: Unprocessable Entity
        message:
          type: array
          description: Unprocessable entity error message
          items:
            type: object
            properties:
              code:
                type: string
                example: 1c407a1d-5cf4-47e0-9a58-3cd72532b846
                nullable: true
              message:
                type: string
                example: This value should be of type string.
              parameter:
                type: string
                example: title
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Error message
          example: Parameter must be provided.
        error:
          type: string
          description: Error type
          example: HTTP Error
    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: The refresh token obtained during login
          example: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    Id:
      type: string
      format: uuid
      description: Unique resource identifier (UUID)
      example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
    NullableId:
      type: string
      format: uuid
      description: Unique resource identifier (UUID)
      example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      nullable: true
    DateTime:
      type: string
      description: Timestamp in format Y-m-d H:i:s
      example: "2025-04-30 14:23:55"
    NullableDateTime:
      type: string
      description: Timestamp in format Y-m-d H:i:s
      example: "2025-04-30 14:23:55"
      nullable: true
    CreatedBy:
      type: string
      description: User that created this resource
      example: admin
    UpdatedBy:
      type: string
      description: User that updated this resource
      example: admin
    CreatedAt:
      type: string
      description: Timestamp from when this resource was created
      example: "2025-04-30 14:23:55"
    UpdatedAt:
      type: string
      description: Timestamp from when this resource was updated
      example: "2025-04-30 14:23:55"
    EditorFields:
      type: object
      properties:
        createdAt:
          $ref: '#/components/schemas/CreatedAt'
        createdBy:
          $ref: '#/components/schemas/CreatedBy'
        updatedAt:
          $ref: '#/components/schemas/UpdatedAt'
        updatedBy:
          $ref: '#/components/schemas/UpdatedBy'
    GroupListResponse:
      type: array
      items:
        oneOf:
          - $ref: '#/components/schemas/GroupMinimised'
          - $ref: '#/components/schemas/GroupWithUserCountAndManagers'
    GroupMinimised:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          description: Name of the group
          example: Administrators
        private:
          type: boolean
          description: Indicates if the group is private
          example: false
    Group:
      allOf:
        - $ref: '#/components/schemas/GroupMinimised'
        - $ref: '#/components/schemas/EditorFields'
    GroupWithUserCount:
      allOf:
        - $ref: '#/components/schemas/Group'
        - type: object
          properties:
            userCount:
              type: number
              description: Number of users in this group
              example: 5
    GroupWithUserCountAndManagers:
      allOf:
        - $ref: "#/components/schemas/GroupWithUserCount"
        - type: object
          properties:
            managers:
              type: array
              description: Managers of this group
              items:
                $ref: '#/components/schemas/UserMinimised'
    GroupWithUsers:
      allOf:
        - $ref: '#/components/schemas/Group'
        - type: object
          properties:
            users:
              type: array
              description: users in this group
              items:
                $ref: '#/components/schemas/UserMinimised'
    GroupWithUsersAndManagers:
      allOf:
        - $ref: "#/components/schemas/GroupWithUsers"
        - type: object
          properties:
            managers:
              type: array
              description: Managers of this group
              items:
                $ref: '#/components/schemas/UserMinimised'
    UserListResponse:
      type: array
      items:
        oneOf:
          - $ref: '#/components/schemas/UserMinimised'
          - $ref: '#/components/schemas/UserWithGroups'
    UserMinimised:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        email:
          type: string
          format: email
          description: User email address
          example: admin@email.com
        username:
          type: string
          description: User display name
          example: admin
    User:
      allOf:
        - $ref: '#/components/schemas/UserMinimised'
        - type: object
          properties:
            managedGroupIds:
              type: array
              description: Ids of groups managed by this user
              items:
                - $ref: '#/components/schemas/Id'
            admin:
              type: boolean
              description: Is the user an admin
              example: true
            verified:
              type: boolean
              description: Is the user verified
              example: true
            active:
              type: boolean
              description: Is the user active
              example: true
            hasPasskeys:
              type: boolean
              description: Whether the user has registered WebAuthn passkeys
              example: false
        - $ref: '#/components/schemas/EditorFields'
    UserWithGroups:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            groups:
              type: array
              description: Groups of the user
              items:
                $ref: "#/components/schemas/GroupMinimised"
    CreateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: User email address
          example: admin@email.com
        username:
          type: string
          description: User display name
          example: admin
        admin:
          type: boolean
          description: Is the user an admin
          example: true
      required:
        - email
        - username
        - admin
    PatchUserRequest:
      type: object
      properties:
        admin:
          type: boolean
          description: Is the user an admin
          example: true
        groups:
          type: array
          description: Groups for the User
          items:
            $ref: '#/components/schemas/Id'
    CreateGroupRequest:
      type: object
      properties:
        name:
          type: string
          description: Name of the group
          example: Developers
        managers:
          type: array
          description: Manager(s) of this group
          items:
            $ref: '#/components/schemas/Id'
        users:
          type: array
          description: Users in this group
          items:
            $ref: '#/components/schemas/Id'
      required:
        - name
        - managers
    PatchGroupRequest:
      type: object
      properties:
        authData:
          $ref: "#/components/schemas/AuthenticationData"
        users:
          type: array
          description: Users in this group
          items:
            $ref: '#/components/schemas/Id'
        managers:
          type: array
          description: Managers of this group
          items:
            $ref: '#/components/schemas/Id'
    VaultMinimised:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          description: Name of the vault
          example: Development
        private:
          type: boolean
          description: Indicates if the vault is private
          example: false
        iconName:
          type: string
          description: Name of the vault icon
          example: "icon-name"
        allowPasswordsAtRoot:
          type: boolean
          description: Indicates if passwords can be stored at the root level
          example: false
    Vault:
      allOf:
        - $ref: '#/components/schemas/VaultMinimised'
        - type: object
          properties:
            description:
              type: string
              description: Description of the vault
              example: "Vault for development"
        - $ref: '#/components/schemas/EditorFields'
    VaultWithGroups:
      allOf:
        - $ref: '#/components/schemas/Vault'
        - type: object
          properties:
            groups:
              type: array
              description: Groups that have access to the vault
              items:
                $ref: "#/components/schemas/ResponseGroupPermissionWithPartial"
            users:
              type: array
              description: Users that have access to the vault
              items:
                $ref: "#/components/schemas/ResponseUserPermissionWithPartial"
    VaultMinimisedWithGroups:
      allOf:
        - $ref: '#/components/schemas/VaultMinimised'
        - type: object
          properties:
            groups:
              type: array
              description: Groups that have access to the vault
              items:
                $ref: "#/components/schemas/GroupMinimised"
    VaultMinimisedWithGroupsWithMandatoryFields:
      allOf:
        - $ref: '#/components/schemas/VaultMinimisedWithGroups'
        - type: object
          properties:
            mandatoryFolderFields:
              type: array
              description: Mandatory fields for folders in this vault
              items:
                type: string
                enum: [external_id]
              nullable: true
              example: [external_id]
            mandatoryPasswordFields:
              type: array
              description: Mandatory fields for passwords in this vault
              items:
                type: string
                enum: [external_id, target, location]
              nullable: true
              example: [external_id, target]
    VaultWithGroupsWithMandatoryFields:
      allOf:
        - $ref: '#/components/schemas/VaultWithGroups'
        - type: object
          properties:
            mandatoryFolderFields:
              type: array
              description: Mandatory fields for folders in this vault
              items:
                type: string
                enum: [external_id]
              nullable: true
              example: [external_id]
            mandatoryPasswordFields:
              type: array
              description: Mandatory fields for passwords in this vault
              items:
                type: string
                enum: [external_id, target, location]
              nullable: true
              example: [external_id, target]
    VaultListResponse:
      type: array
      items:
        $ref: '#/components/schemas/VaultMinimisedWithGroupsWithMandatoryFields'
    PaginatedAuditLogListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Pagination:
      type: object
      properties:
        next:
          type: string
          format: uri
          nullable: true
          description: URL to the next page of results
        previous:
          type: string
          format: uri
          nullable: true
          description: URL to the previous page of results
    AuditLog:
      allOf:
        - $ref: '#/components/schemas/Changelog'
        - type: object
          properties:
            entityType:
              type: string
              description: Type of entity affected
              example: App\Entity\User
              nullable: true
            userId:
              $ref: '#/components/schemas/NullableId'
            ipAddress:
              type: string
              description: IP address of the user that performed the action
              example: 127.0.0.1
              nullable: true
            userAgent:
              type: string
              description: User agent of the user that performed the action
              example: chrome web browser
              nullable: true
            metadata:
              type: string
              description: Metadata to identify the affected resource
              example: Password-123[example.com]
    Changelog:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        actionType:
          type: string
          description: Type of action performed
          example: created
          enum: [created, read, updated, deleted, successful_login, failed_login, refreshed_token]
        userEmail:
          type: string
          description: Email of the user that performed the action
          example: admin @example.com
          format: email
          nullable: true
        oldValues:
          type: object
          description: Old values of the entity
          example: { "email": "old@email.com" }
          nullable: true
        newValues:
          type: object
          description: New values of the entity
          example: { "email": "new@email.com" }
          nullable: true
        createdAt:
          $ref: '#/components/schemas/NullableDateTime'
    ChangelogSummarized:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        type:
          type: string
          description: Type of action performed
          example: created
          enum: [created, read, updated, deleted, successful_login, failed_login, refreshed_token]
        fields:
          type: array
          items:
            type: string
            description: Fields that have changed
            example: ["email", "username"]
        timeStamp:
          $ref: '#/components/schemas/DateTime'
    ChangelogSummarizedList:
      type: array
      items:
        $ref: '#/components/schemas/ChangelogSummarized'
    ClientEncryptedData:
      type: object
      properties:
        encryptedData:
          type: string
          description: Base 64 Url encoded encrypted data
          example: QzZ3VnZxV1pKZFp1aHh0V1VqQkF1N1lrd0pFb3F1V2E
        clientPublicKey:
          type: string
          description: Base 64 Url public key of the client
          example: QzZ3VnZxV1pKZFp1aHh0V1VqQkF1N1lrd0pFb3F1V2E
        nonce:
          type: string
          description: Base 64 url encoded nonce used to encrypt the data
          example: QzZ3VnZxV1pKZFp1aHh0V1VqQkF1N1lrd0pFb3F1V2E
    UserEncryptedData:
      type: object
      properties:
        encryptedData:
          type: string
          description: Base 64 Url encoded encrypted data
          example: QzZ3VnZxV1pKZFp1aHh0V1VqQkF1N1lrd0pFb3F1V2E
        userPublicKey:
          type: string
          description: Base 64 Url public key of the user
          example: QzZ3VnZxV1pKZFp1aHh0V1VqQkF1N1lrd0pFb3F1V2E
        nonce:
          type: string
          description: Base 64 url encoded nonce used to encrypt the data
          example: QzZ3VnZxV1pKZFp1aHh0V1VqQkF1N1lrd0pFb3F1V2E
    FolderMinimised:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          description: Name of the folder
          example: Development
        iconName:
          type: string
          description: Name of the folder icon
          example: "folder"
    Folder:
      allOf:
        - $ref: '#/components/schemas/FolderMinimised'
        - $ref: '#/components/schemas/EditorFields'
        - type: object
          properties:
            externalId:
              type: string
              description: External Id of the folder
              example: 123
              nullable: true
            description:
              type: string
              description: Description of the folder
              example: Development folder
              nullable: true
    FolderWithGroups:
      allOf:
        - $ref: '#/components/schemas/Folder'
        - type: object
          properties:
            groups:
              type: array
              description: Groups that have access to the folder
              items:
                $ref: "#/components/schemas/ResponseGroupPermissionWithPartial"
            users:
              type: array
              description: Users that have access to the folder
              items:
                $ref: "#/components/schemas/ResponseUserPermissionWithPartial"
    ResponseGroupPermission:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          description: Name of the group
          example: Administrators
        canWrite:
          type: boolean
          description: Can the group write to this resource
          example: true
    ResponseGroupPermissionWithPartial:
      allOf:
        - $ref: '#/components/schemas/ResponseGroupPermission'
        - type: object
          properties:
            partial:
              type: boolean
              description: Does the group see only part of the resources in this resource
              example: false
    RequestGroupPermission:
      type: object
      properties:
        groupId:
          $ref: '#/components/schemas/Id'
        canWrite:
          type: boolean
          description: Can the group write to this resource
          example: true
    RequestGroupPermissionWithPartial:
      allOf:
        - $ref: '#/components/schemas/RequestGroupPermission'
        - type: object
          properties:
            partial:
              type: boolean
              description: Does the group see only part of the resources in this resource(cannot be manually overridden)
              example: false
    RequestUserPermission:
      type: object
      properties:
        userId:
          $ref: '#/components/schemas/Id'
        canWrite:
          type: boolean
          description: Can the user write to this resource
          example: true
    RequestUserPermissionWithPartial:
      allOf:
        - $ref: '#/components/schemas/RequestUserPermission'
        - type: object
          properties:
            partial:
              type: boolean
              description: Does the user see only part of the resources in this resource
              example: false
    ResponseUserPermission:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        username:
          type: string
          description: Username of the user
          example: john.doe
        canWrite:
          type: boolean
          description: Can the user write to this resource
          example: true
    ResponseUserPermissionWithPartial:
      allOf:
        - $ref: '#/components/schemas/ResponseUserPermission'
        - type: object
          properties:
            partial:
              type: boolean
              description: Does the user see only part of the resources in this resource
              example: false
    CreateFolderRequest:
      type: object
      properties:
        name:
          type: string
          description: Name of the folder
          example: Development
        vaultId:
          $ref: '#/components/schemas/Id'
        parentFolderId:
          $ref: '#/components/schemas/NullableId'
        externalId:
          type: string
          description: External Id of the folder
          example: 123
          nullable: true
        iconName:
          type: string
          description: Icon of the folder
          example: folder
          default: folder
        description:
          type: string
          description: Description of the folder
          example: Development folder
          nullable: true
        groups:
          type: array
          description: Groups that have access to the folder
          items:
            $ref: "#/components/schemas/RequestGroupPermission"
        userPermissions:
          type: array
          description: Users that have access to the folder
          items:
            $ref: "#/components/schemas/RequestUserPermission"
      required:
        - name
        - vaultId
    PasswordMinimised:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        title:
          type: string
          description: Title of the password
          example: Password-123
    Password:
      allOf:
        - $ref: '#/components/schemas/PasswordMinimised'
        - $ref: '#/components/schemas/EditorFields'
        - type: object
          properties:
            target:
              type: string
              description: Target of the password
              example: https://example.com
              nullable: true
            description:
              type: string
              description: Description of the password
              example: Password for example.com
              nullable: true
            location:
              type: string
              description: Location of the password
              example: floor 1
            externalId:
              type: string
              description: External Id of the password
              example: 123
              nullable: true
            hasTotp:
              type: boolean
              description: Whether the password has TOTP configured
              example: false
            totpPeriod:
              allOf:
                - $ref: '#/components/schemas/TotpPeriod'
                - nullable: true
              description: TOTP period in seconds (null if no TOTP configured)
    PasswordWithGroups:
      allOf:
        - $ref: '#/components/schemas/Password'
        - type: object
          properties:
            groups:
              type: array
              description: Groups that have access to the password
              items:
                $ref: "#/components/schemas/ResponseGroupPermission"
            users:
              type: array
              description: Users that have access to the password
              items:
                $ref: "#/components/schemas/ResponseUserPermission"
    PasswordWithFolderWithGroups:
      allOf:
        - $ref: '#/components/schemas/PasswordWithGroups'
        - type: object
          properties:
            folder:
              $ref: '#/components/schemas/FolderMinimised'
    PasswordWithGroupsList:
      type: array
      items:
        $ref: '#/components/schemas/PasswordWithGroups'
    FolderStructure:
      allOf:
        - $ref: '#/components/schemas/FolderMinimised'
        - type: object
          properties:
            parentId:
              $ref: '#/components/schemas/NullableId'
    PatchPermissionsWithPartial:
      type: object
      properties:
        authData:
          $ref: "#/components/schemas/AuthenticationData"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/RequestGroupPermissionWithPartial"
        userPermissions:
          type: array
          items:
            $ref: "#/components/schemas/RequestUserPermissionWithPartial"
        cascade:
          type: boolean
          default: false
          description: Set to true to apply the permissions to all sub resources
      required:
        - authData
    PatchPermissions:
      type: object
      properties:
        authData:
          $ref: "#/components/schemas/AuthenticationData"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/RequestGroupPermission"
        userPermissions:
          type: array
          items:
            $ref: "#/components/schemas/RequestUserPermission"
      required:
        - authData
    ShareProcessMinimised:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        scopeId:
          type: string
          description: On which resource the share is applied
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        metadata:
          type: string
          description: Metadata to identify the affected resource
          example: Password-123[example.com]
        targetType:
          type: string
          description: Type of resource that is shared
          enum: [password, folder]
          example: password
        cascade:
          type: boolean
          default: false
          description: Set to true to apply the permissions to all sub resources
        requestedGroups:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/RequestGroupPermissionWithPartial'
              - type: object
                properties:
                  name:
                    type: string
                    description: Name of the group
                    example: Administrators
        requestedUsers:
          type: array
          nullable: true
          items:
            allOf:
              - $ref: '#/components/schemas/RequestUserPermissionWithPartial'
              - type: object
                properties:
                  username:
                    type: string
                    description: Username of the user
                    example: john.doe
                  email:
                    type: string
                    description: Email of the user
                    example: john.doe@example.com
        status:
          type: string
          description: Status of the share
          enum: [pending, completed, failed, canceled, running]
          example: pending
    ShareProcess:
      allOf:
        - $ref: '#/components/schemas/ShareProcessMinimised'
        - type: object
          properties:
            totalItems:
              type: number
              description: Total number of items to be shared
              example: 100
            processedItems:
              type: number
              description: Number of items that have been processed
              example: 0
            failedItems:
              type: number
              description: Number of items that have failed
              example: 0
            message:
              type: string
              description: Message to display to the user
              example: "Processing 100 items"
            createdAt:
              $ref: '#/components/schemas/CreatedAt'
            createdBy:
              $ref: '#/components/schemas/CreatedBy'
            updatedAt:
              $ref: '#/components/schemas/UpdatedAt'
            startedAt:
              type: string
              description: Timestamp from when the share process started
              example: "2025-04-30 14:23:55"
            finishedAt:
              type: string
              description: Timestamp from when the share process finished
              example: "2025-04-30 14:23:55"
    CreatePasswordRequest:
      type: object
      properties:
        title:
          type: string
          description: Title of the password
          example: Password-123
        encryptedPassword:
          $ref: "#/components/schemas/ClientEncryptedData"
        encryptedUsername:
          $ref: "#/components/schemas/ClientEncryptedData"
        target:
          type: string
          description: Target of the password
          example: https://example.com
          nullable: true
        description:
          type: string
          description: Description of the password
          example: Password for example.com
        location:
          type: string
          description: Location of the password
          example: floor 1
        externalId:
          type: string
          description: External Id of the password
          example: 123
          nullable: true
        vaultId:
          $ref: '#/components/schemas/Id'
        folderId:
          $ref: '#/components/schemas/NullableId'
        groups:
          type: array
          description: Groups that have access to the password
          items:
            $ref: "#/components/schemas/RequestGroupPermission"
        userPermissions:
          type: array
          description: Users that have access to the password
          items:
            $ref: "#/components/schemas/RequestUserPermission"
        totp:
          $ref: "#/components/schemas/TotpData"
      required:
        - title
        - encryptedPassword
        - vaultId
    ImportPasswordsRequest:
      type: object
      properties:
        items:
          type: array
          description: List of passwords to import (1-100 items)
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ImportPasswordItem'
      required:
        - items
    ImportPasswordItem:
      type: object
      properties:
        title:
          type: string
          description: Title of the password
          maxLength: 255
          example: My Imported Password
        vaultId:
          $ref: '#/components/schemas/Id'
        encryptedPassword:
          $ref: '#/components/schemas/ClientEncryptedData'
        encryptedUsername:
          allOf:
            - $ref: '#/components/schemas/ClientEncryptedData'
            - nullable: true
        target:
          type: string
          description: Target URL or identifier
          maxLength: 255
          example: https://example.com
          nullable: true
        location:
          type: string
          description: Location of the password
          maxLength: 255
          example: floor 1
          nullable: true
        externalId:
          type: string
          description: External identifier
          maxLength: 255
          example: ext-123
          nullable: true
        folderId:
          allOf:
            - $ref: '#/components/schemas/NullableId'
            - description: Folder to place the password in (null for vault root)
      required:
        - title
        - vaultId
        - encryptedPassword
    ImportPasswordsResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ImportPasswordResult'
        successCount:
          type: integer
          description: Number of successfully imported passwords
          example: 3
        failureCount:
          type: integer
          description: Number of failed imports
          example: 1
    ImportPasswordResult:
      type: object
      properties:
        row:
          type: integer
          description: Index of the item in the request array
          example: 0
        success:
          type: boolean
          description: Whether the import succeeded
          example: true
        error:
          type: string
          description: Error message (only present on failure)
          example: Invalid vault ID.
          nullable: true
    PasswordSensitiveDataResponse:
      type: object
      properties:
        username:
          allOf:
            - $ref: "#/components/schemas/UserEncryptedData"
            - nullable: true
        password:
          $ref: "#/components/schemas/UserEncryptedData"
        userKeys:
          $ref: "#/components/schemas/UserKeysResponse"
    TotpAlgorithm:
      type: string
      enum: [sha1, sha256, sha512]
      description: TOTP algorithm
      example: sha1
    TotpPeriod:
      type: integer
      enum: [30, 60]
      description: TOTP period in seconds
      example: 30
    TotpDigits:
      type: integer
      enum: [6, 8]
      description: Number of TOTP digits
      example: 6
    TotpData:
      type: object
      description: TOTP data for creating or updating a password
      properties:
        encryptedSecretKey:
          $ref: "#/components/schemas/ClientEncryptedData"
        algorithm:
          $ref: "#/components/schemas/TotpAlgorithm"
        period:
          $ref: "#/components/schemas/TotpPeriod"
        digits:
          $ref: "#/components/schemas/TotpDigits"
      required:
        - encryptedSecretKey
        - algorithm
        - period
        - digits
    TotpDataResponse:
      type: object
      description: TOTP data response (with re-encrypted secret key)
      properties:
        secretKey:
          $ref: "#/components/schemas/UserEncryptedData"
        algorithm:
          $ref: "#/components/schemas/TotpAlgorithm"
        period:
          $ref: "#/components/schemas/TotpPeriod"
        digits:
          $ref: "#/components/schemas/TotpDigits"
    PasswordTotpDataResponse:
      type: object
      properties:
        totp:
          allOf:
            - $ref: "#/components/schemas/TotpDataResponse"
            - nullable: true
        userKeys:
          $ref: "#/components/schemas/UserKeysResponse"
    TimeBasedShareDuration:
      type: string
      enum: [1h, 2h, 24h]
      description: Duration for the time-based share
      example: 1h
    CreateTimeBasedShareRequest:
      type: object
      properties:
        passwordId:
          $ref: "#/components/schemas/Id"
        recipientId:
          $ref: "#/components/schemas/Id"
        duration:
          $ref: "#/components/schemas/TimeBasedShareDuration"
        authData:
          $ref: "#/components/schemas/AuthenticationData"
      required:
        - passwordId
        - recipientId
        - duration
        - authData
    TimeBasedShareResponse:
      type: object
      description: Time-based share response (always includes both sharedBy and sharedWith)
      properties:
        id:
          $ref: "#/components/schemas/Id"
        passwordTitle:
          type: string
          example: My Password
        sharedBy:
          $ref: "#/components/schemas/UserMinimised"
        sharedWith:
          $ref: "#/components/schemas/UserMinimised"
        expiresAt:
          $ref: "#/components/schemas/DateTime"
        accessedAt:
          allOf:
            - $ref: "#/components/schemas/DateTime"
            - nullable: true
        createdAt:
          $ref: "#/components/schemas/DateTime"
    TimeBasedShareSensitiveDataResponse:
      type: object
      description: Encrypted sensitive data for a time-based share
      properties:
        password:
          type: object
          properties:
            encryptedData:
              type: string
            nonce:
              type: string
            encryptionPublicKey:
              type: string
        username:
          type: object
          nullable: true
          properties:
            encryptedData:
              type: string
            nonce:
              type: string
            encryptionPublicKey:
              type: string
        userKeys:
          $ref: "#/components/schemas/UserKeysResponse"
    PrfClientData:
      type: object
      description: PRF-based authentication data from a WebAuthn passkey
      properties:
        credentialId:
          type: string
          description: Base64url-encoded WebAuthn credential ID
        encryptedData:
          type: string
          description: PRF-derived key encrypted for the server
        clientPublicKey:
          type: string
          description: Client's transport encryption public key
        nonce:
          type: string
          description: Transport encryption nonce
      required:
        - credentialId
        - encryptedData
        - clientPublicKey
        - nonce
    AuthenticationData:
      type: object
      description: >
        Authentication data supporting either password or PRF (passkey) authentication.
        Exactly one of encryptedPassword or prfData must be provided.
      properties:
        encryptedPassword:
          allOf:
            - $ref: "#/components/schemas/ClientEncryptedData"
            - nullable: true
          description: Password-based authentication
        prfData:
          allOf:
            - $ref: "#/components/schemas/PrfClientData"
            - nullable: true
          description: PRF-based (passkey) authentication
    UserKeysResponse:
      type: object
      description: >
        User's encryption keys for client-side decryption. The format varies based on the authentication method used.
      oneOf:
        - type: object
          title: Password-based keys
          properties:
            authMethod:
              type: string
              enum: [password]
            privateKey:
              type: string
              description: User's private key encrypted with Argon2ID-derived key
            nonce:
              type: string
              description: Nonce used to encrypt the private key
            salt:
              type: string
              description: Salt used for Argon2ID key derivation
          required:
            - authMethod
            - privateKey
            - nonce
            - salt
        - type: object
          title: PRF-based keys
          properties:
            authMethod:
              type: string
              enum: [prf]
            privateKey:
              type: string
              description: User's private key encrypted with PRF-derived key
            nonce:
              type: string
              description: Nonce used for PRF encryption
            credentialId:
              type: string
              description: Base64-encoded credential ID
            prfSalt:
              type: string
              description: Base64-encoded PRF salt for key derivation
          required:
            - authMethod
            - privateKey
            - nonce
            - credentialId
            - prfSalt
    WebAuthnCredential:
      type: object
      description: A registered WebAuthn passkey credential
      allOf:
        - type: object
          properties:
            id:
              $ref: "#/components/schemas/Id"
            name:
              type: string
              description: User-provided name for this passkey
              example: "MacBook Touch ID"
            cacheOnUse:
              type: boolean
              description: Whether to cache the credential on use
              example: true
            lastUsedAt:
              allOf:
                - $ref: "#/components/schemas/DateTime"
                - nullable: true
              description: When the credential was last used for authentication
        - $ref: "#/components/schemas/EditorFields"
    VerifyRegistrationRequest:
      type: object
      properties:
        credential:
          type: object
          description: The serialized PublicKeyCredential from the browser
        name:
          type: string
          description: User-provided name for this passkey
          maxLength: 255
        prfSalt:
          type: string
          description: Base64-encoded PRF salt used during registration
        prfEncryptedPrivateKey:
          type: string
          description: User's private key re-encrypted with the PRF-derived key
        prfPrivateKeyNonce:
          type: string
          description: Nonce used for PRF encryption
        encryptedPassword:
          $ref: "#/components/schemas/ClientEncryptedData"
        cacheOnUse:
          type: boolean
          default: true
          description: Whether to cache the credential on use
      required:
        - credential
        - name
        - prfSalt
        - prfEncryptedPrivateKey
        - prfPrivateKeyNonce
        - encryptedPassword
    PatchCredentialRequest:
      type: object
      properties:
        cacheOnUse:
          type: boolean
          description: Whether to cache the credential on use
