  /change-password:
    post:
      tags:
        - Users
      summary: Change master password
      description: >
        Change the authenticated user's master password. Requires authentication via password or PRF.
        Re-encrypts the user's private key with the new password using Argon2ID key derivation.
        The user's public key and all group/password encryption remain unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                authData:
                  $ref: "#/components/schemas/AuthenticationData"
                newEncryptedPassword:
                  $ref: "#/components/schemas/ClientEncryptedData"
              required:
                - authData
                - newEncryptedPassword
        description: >
          The request body must contain authentication data (current password or PRF)
          and the new password encrypted with the server's public key.
      responses:
        204:
          description: Password changed successfully
        400:
          description: New password does not meet strength requirements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          description: Authentication failed (invalid current password or PRF)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorResponse'
        422:
          description: Unprocessable Entity (invalid request body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessableEntityErrorResponse'
